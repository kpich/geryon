[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geryon"
version = "0.1.0"
description = "cancer hypothesis generation"
requires-python = ">=3.11, <4"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.4",
    "instructor>=1.0",
    "langchain-anthropic>=0.1",
    "langchain-aws>=0.1",
    "langchain-community>=0.2",
    "langchain-openai>=0.1",
    "langgraph>=0.2",
    "lifelines>=0.27.0",
    "matplotlib>=3.7",
    "openai>=1.0",
    "pandas>=2.3",
    "pyarrow>=22.0",
    "pydantic>=2.12",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs",
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "ruff",
    "types-requests",
    "types-tqdm",
]
test = [
    "flask>=2.3",
    "pytest",
]
annotate = [
    "flask>=2.3",
]
viewer = [
    "flask>=2.3",
    "harlequin[duckdb]>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbird_data = ["py.typed"]
geryon = ["legacy/cli/templates/*.html", "cli/templates/*.html"]

[tool.pytest.ini_options]
addopts = "--ignore=src/geryon/legacy"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:lifelines",
    "ignore::UserWarning:lifelines",
    "ignore::FutureWarning:pandas.*",
    "ignore:Core Pydantic V1 functionality.*:UserWarning",
]

# Legacy spec-based stack is parked under src/geryon/legacy/ as a fallback until the
# code-first path is proven; it is excluded from type-checking and linting so it no
# longer gates the build.
[tool.mypy]
exclude = ["src/geryon/legacy/"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/geryon/legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["SIM108"]  # Allow if-else over ternary for readability

[tool.ruff.lint.per-file-ignores]
"src/geryon/codeflow/prompts.py" = ["E501"]  # Long lines in prompt string literals

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = true
known-first-party = ["geryon"]
