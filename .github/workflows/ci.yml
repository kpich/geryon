name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv reads .python-version (3.14) and downloads the interpreter if needed.
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff lint
        run: uv run --no-sync ruff check src/

      - name: Ruff format
        run: uv run --no-sync ruff format --check src/

      - name: mypy
        run: uv run --no-sync mypy --check-untyped-defs src/geryon

      - name: Tests
        run: uv run --no-sync pytest src/
