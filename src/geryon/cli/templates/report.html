<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypothesis Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f5f5f5; color: #333; line-height: 1.5; padding: 20px; }
  h1 { text-align: center; margin-bottom: 8px; }
  #stats { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }
  .empty { text-align: center; color: #999; margin-top: 60px; font-size: 18px; }

  /* Collapsed row */
  .hyp-row { background: #fff; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08);
             margin: 0 auto 4px; max-width: 900px; cursor: pointer;
             transition: box-shadow .15s; }
  .hyp-row:hover { box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .hyp-row.highlight { animation: flash 1.5s ease-out; }
  @keyframes flash {
    0% { background: #fef3c7; }
    100% { background: #fff; }
  }
  .row-summary { display: flex; align-items: center; gap: 10px; padding: 8px 16px;
                 font-size: 13px; }
  .row-id { font-family: "SF Mono", "Fira Code", monospace; color: #6b7280;
            font-size: 12px; min-width: 72px; }
  .row-date { color: #9ca3af; font-size: 12px; min-width: 80px; }
  .row-desc { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-stat { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px;
              color: #4b5563; min-width: 140px; text-align: right; }
  .row-badge { font-size: 10px; font-variant: small-caps; font-weight: 700;
               padding: 2px 8px; border-radius: 3px; min-width: 52px;
               text-align: center; }
  .badge-human { background: #dcfce7; color: #166534; }
  .badge-critic { background: #fef3c7; color: #92400e; }
  .badge-pending { background: #f3f4f6; color: #6b7280; }
  .row-novelty { font-size: 11px; font-weight: 600; min-width: 20px;
                 text-align: center; border-radius: 3px; padding: 1px 5px; }
  .row-novelty-1 { color: #9ca3af; }
  .row-novelty-2 { color: #d97706; }
  .row-novelty-3 { color: #059669; }
  .row-uncontrolled { font-size: 11px; font-weight: 600; min-width: 20px;
                      text-align: center; border-radius: 3px; padding: 1px 5px; }
  .row-uncontrolled-1 { color: #059669; }
  .row-uncontrolled-2 { color: #d97706; }
  .row-uncontrolled-3 { color: #dc2626; }
  .row-trust { font-size: 11px; font-weight: 600; min-width: 20px;
               text-align: center; border-radius: 3px; padding: 1px 5px; }
  .row-trust-1 { color: #dc2626; }
  .row-trust-2 { color: #d97706; }
  .row-trust-3 { color: #059669; }
  .row-toggle { color: #9ca3af; font-size: 14px; min-width: 16px; text-align: center;
                transition: transform .2s; }
  .hyp-row.open .row-toggle { transform: rotate(90deg); }
  .row-refines { font-size: 11px; color: #8b5cf6; cursor: pointer; }
  .row-refines:hover { text-decoration: underline; }

  /* Session divider */
  .session-divider { max-width: 900px; margin: 16px auto 8px; padding: 0 16px;
                     font-size: 11px; color: #9ca3af; border-top: 1px solid #e5e7eb;
                     padding-top: 8px; }

  /* Expanded detail */
  .hyp-detail { display: none; padding: 16px 24px; border-top: 1px solid #f0f0f0; }
  .hyp-row.open .hyp-detail { display: block; }
  .field { margin-bottom: 12px; }
  .field-label { font-weight: 600; font-size: 13px; color: #666;
                 text-transform: uppercase; letter-spacing: .5px;
                 margin-bottom: 2px; }
  .field-value { font-size: 15px; }
  table.stats { border-collapse: collapse; width: 100%; margin: 8px 0; }
  table.stats th, table.stats td { padding: 6px 12px; text-align: left;
                                    border-bottom: 1px solid #eee; font-size: 14px; }
  table.stats th { color: #666; font-weight: 600; }
  pre.spec { background: #f8f8f8; border: 1px solid #e0e0e0;
             border-radius: 6px; padding: 12px; font-size: 13px;
             overflow-x: auto; line-height: 1.4; }

  /* Critic rating display */
  .critic-section { background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px;
                    padding: 12px; margin-bottom: 12px; }
  .critic-section .section-title { font-size: 12px; font-weight: 700; color: #92400e;
                                    text-transform: uppercase; margin-bottom: 6px; }
  .critic-badge { display: inline-block; background: #fef3c7; color: #92400e;
                  font-size: 12px; padding: 2px 8px; border-radius: 3px;
                  margin-right: 6px; margin-bottom: 4px; }

  /* Human rating display (read-only) */
  .human-section { border: 1px solid #bbf7d0; border-radius: 6px; padding: 12px;
                   margin-bottom: 12px; background: #f0fdf4; }
  .human-section .section-title { font-size: 12px; font-weight: 700; color: #166534;
                                   text-transform: uppercase; margin-bottom: 6px; }
  .human-badge { display: inline-block; background: #dcfce7; color: #166534;
                 font-size: 12px; padding: 2px 8px; border-radius: 3px;
                 margin-right: 6px; margin-bottom: 4px; }

  /* Footer */
  .report-footer { text-align: center; color: #9ca3af; font-size: 12px;
                   margin-top: 40px; padding-top: 16px; border-top: 1px solid #e5e7eb;
                   max-width: 900px; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>
<h1>Hypothesis Report</h1>
<div id="stats">{{ stats.total }} total | {{ stats.human_labeled }} human-rated | {{ stats.critic_labeled }} critic-rated | {{ stats.pending }} pending</div>
<div id="rows"></div>
<div class="report-footer">Generated {{ generated_at }}</div>

<script>
const HYPOTHESES = {{ hypotheses_json | safe }};
const DIMENSIONS = {{ dimensions_json | safe }};

function fmtVal(v, digits) {
  return v != null ? Number(v).toFixed(digits) : "N/A";
}

function keyStat(h) {
  if (h.hazard_ratio != null) {
    return "HR=" + fmtVal(h.hazard_ratio, 2) + ", p=" + fmtVal(h.p_value, 4);
  }
  if (h.u_statistic != null) {
    return "U=" + fmtVal(h.u_statistic, 1) + ", p=" + fmtVal(h.p_value, 4);
  }
  return "p=" + fmtVal(h.p_value, 4);
}

function badgeClass(status) {
  if (status === "human_labeled") return "badge-human";
  if (status === "critic_labeled") return "badge-critic";
  return "badge-pending";
}

function badgeLabel(status) {
  if (status === "human_labeled") return "HUMAN";
  if (status === "critic_labeled") return "CRITIC";
  return "PENDING";
}

function ratingSpan(val, prefix, titlesMap, colorClass) {
  if (val == null) return "";
  return `<span class="${colorClass} ${colorClass}-${val}"
               title="${titlesMap[val]}">${prefix}${val}</span>`;
}

function ratingsSpans(h) {
  const hr = h.human_rating || {};
  const cr = h.critic_rating || {};
  const nov = hr.novelty ?? cr.novelty ?? null;
  const unc = hr.uncontrolled ?? cr.uncontrolled ?? null;
  const tru = hr.trustworthiness ?? cr.trustworthiness ?? null;

  const novTitles = {1: "Known/obvious", 2: "Somewhat expected", 3: "Surprising"};
  const uncTitles = {1: "Clean", 2: "Partially mixed", 3: "Heavily mixed"};
  const truTitles = {1: "Suspect", 2: "Uncertain", 3: "Credible"};

  return ratingSpan(nov, "N", novTitles, "row-novelty")
       + ratingSpan(unc, "U", uncTitles, "row-uncontrolled")
       + ratingSpan(tru, "T", truTitles, "row-trust");
}

function esc(s) {
  if (s == null) return "";
  const d = document.createElement("div");
  d.textContent = String(s);
  return d.innerHTML;
}

function scrollToHyp(hid) {
  let el = document.getElementById("row-" + hid);
  if (!el) {
    el = document.querySelector('[id^="row-' + hid + '"]');
  }
  if (el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("highlight");
    setTimeout(() => el.classList.remove("highlight"), 2000);
  }
}

function buildResultsTable(h) {
  if (h.hazard_ratio != null) {
    return `<table class="stats">
      <tr><th>N (A)</th><th>N (B)</th><th>HR</th><th>95% CI</th><th>p-value</th></tr>
      <tr>
        <td>${h.cohort_a_size}</td><td>${h.cohort_b_size}</td>
        <td>${fmtVal(h.hazard_ratio, 3)}</td>
        <td>[${fmtVal(h.confidence_interval_lower, 3)}, ${fmtVal(h.confidence_interval_upper, 3)}]</td>
        <td>${fmtVal(h.p_value, 4)}</td>
      </tr>
    </table>`;
  }
  if (h.u_statistic != null) {
    return `<table class="stats">
      <tr><th>N (A)</th><th>N (B)</th><th>Median A</th><th>Median B</th><th>U</th><th>p-value</th></tr>
      <tr>
        <td>${h.cohort_a_size}</td><td>${h.cohort_b_size}</td>
        <td>${fmtVal(h.median_a, 2)}</td><td>${fmtVal(h.median_b, 2)}</td>
        <td>${fmtVal(h.u_statistic, 1)}</td><td>${fmtVal(h.p_value, 4)}</td>
      </tr>
    </table>`;
  }
  return `<table class="stats">
    <tr><th>N (A)</th><th>N (B)</th><th>p-value</th></tr>
    <tr><td>${h.cohort_a_size}</td><td>${h.cohort_b_size}</td><td>${fmtVal(h.p_value, 4)}</td></tr>
  </table>`;
}

function buildCriticSection(h) {
  if (!h.critic_rating) return "";
  const cr = h.critic_rating;
  let badges = "";
  if (cr.novelty != null) badges += `<span class="critic-badge">Novelty: ${cr.novelty}</span>`;
  if (cr.uncontrolled != null) badges += `<span class="critic-badge">Uncontrolled: ${cr.uncontrolled}</span>`;
  if (cr.trustworthiness != null) badges += `<span class="critic-badge">Trust: ${cr.trustworthiness}</span>`;
  if (cr.is_duplicate) badges += `<span class="critic-badge">Duplicate</span>`;
  if (cr.is_na) badges += `<span class="critic-badge">N/A</span>`;
  let notes = h.critic_notes ? `<div style="margin-top:6px;font-size:13px;color:#92400e">${esc(h.critic_notes)}</div>` : "";
  return `<div class="critic-section">
    <div class="section-title">Critic Rating</div>
    ${badges}${notes}
  </div>`;
}

function buildHumanSection(h) {
  if (!h.human_rating) return "";
  const hr = h.human_rating;
  let badges = "";
  if (hr.novelty != null) badges += `<span class="human-badge">Novelty: ${hr.novelty}</span>`;
  if (hr.uncontrolled != null) badges += `<span class="human-badge">Uncontrolled: ${hr.uncontrolled}</span>`;
  if (hr.trustworthiness != null) badges += `<span class="human-badge">Trust: ${hr.trustworthiness}</span>`;
  if (hr.is_duplicate) badges += `<span class="human-badge">Duplicate</span>`;
  if (hr.is_na) badges += `<span class="human-badge">N/A</span>`;
  let notes = h.human_notes ? `<div style="margin-top:6px;font-size:13px;color:#166534">${esc(h.human_notes)}</div>` : "";
  return `<div class="human-section">
    <div class="section-title">Human Rating</div>
    ${badges}${notes}
  </div>`;
}

function toggleRow(hid) {
  const row = document.getElementById("row-" + hid);
  if (row) row.classList.toggle("open");
}

function renderAll(hyps) {
  const container = document.getElementById("rows");
  container.innerHTML = "";

  if (hyps.length === 0) {
    container.innerHTML = '<div class="empty">No hypotheses found.</div>';
    return;
  }

  let lastSession = null;

  hyps.forEach((h) => {
    if (lastSession !== null && h.session_id !== lastSession) {
      const divider = document.createElement("div");
      divider.className = "session-divider";
      divider.textContent = "Session: " + h.session_id;
      container.appendChild(divider);
    }
    lastSession = h.session_id;

    const row = document.createElement("div");
    row.className = "hyp-row";
    row.id = "row-" + h.hypothesis_id;

    const hidShort = h.hypothesis_id.substring(0, 8);
    const dateStr = h.created_at.substring(0, 10);
    const desc = esc(h.cohort_a_description) + " vs " + esc(h.cohort_b_description);
    const stat = keyStat(h);
    const badge = badgeClass(h.status);
    const label = badgeLabel(h.status);

    let refinesLink = "";
    if (h.refines_hypothesis_short) {
      refinesLink = `<span class="row-refines" onclick="event.stopPropagation();scrollToHyp('${esc(h.refines_hypothesis)}')"
        title="Refines ${esc(h.refines_hypothesis_short)}">&#8627; ${esc(h.refines_hypothesis_short)}</span>`;
    }

    let refinementField = "";
    if (h.refines_hypothesis) {
      refinementField = `<div class="field">
        <div class="field-label">Refines</div>
        <div class="field-value">
          <a href="#" onclick="event.preventDefault();event.stopPropagation();scrollToHyp('${esc(h.refines_hypothesis)}')"
             style="color:#8b5cf6">${esc(h.refines_hypothesis_short)}</a>
        </div>
      </div>`;
    }

    row.innerHTML = `
      <div class="row-summary" onclick="toggleRow('${h.hypothesis_id}')">
        <span class="row-id">${hidShort}</span>
        <span class="row-date">${dateStr}</span>
        <span class="row-desc">${desc}</span>
        ${refinesLink}
        <span class="row-stat">${stat}</span>
        ${ratingsSpans(h)}
        <span class="row-badge ${badge}">${label}</span>
        <span class="row-toggle">&#9656;</span>
      </div>
      <div class="hyp-detail" onclick="event.stopPropagation()">
        <div class="field">
          <div class="field-label">Cohort A</div>
          <div class="field-value">${esc(h.cohort_a_description)}</div>
        </div>
        <div class="field">
          <div class="field-label">Cohort B</div>
          <div class="field-value">${esc(h.cohort_b_description)}</div>
        </div>
        <div class="field">
          <div class="field-label">Rationale</div>
          <div class="field-value">${esc(h.rationale)}</div>
        </div>
        ${refinementField}
        ${buildResultsTable(h)}
        <div class="field">
          <div class="field-label">Summary</div>
          <div class="field-value">${esc(h.summary)}</div>
        </div>
        <div class="field">
          <div class="field-label">Findings</div>
          <div class="field-value">${esc(h.findings)}</div>
        </div>
        <div class="field">
          <div class="field-label">Limitations</div>
          <div class="field-value">${esc(Array.isArray(h.limitations) ? h.limitations.join("; ") : h.limitations)}</div>
        </div>
        <div class="field">
          <div class="field-label">Clinical Relevance</div>
          <div class="field-value">${esc(h.clinical_relevance)}</div>
        </div>
        <details style="margin-bottom:12px">
          <summary style="cursor:pointer;font-size:13px;color:#666">Spec JSON</summary>
          <pre class="spec">${esc(JSON.stringify(h.spec, null, 2))}</pre>
        </details>
        ${buildCriticSection(h)}
        ${buildHumanSection(h)}
      </div>
    `;
    container.appendChild(row);
  });
}

renderAll(HYPOTHESES);
</script>
</body>
</html>
